[package]
name = "awaylock-app"
version.workspace = true
edition.workspace = true
description = "awaylock 跨平台備用介面（egui）。macOS 使用 apps/macos 的 Swift 原生介面；這個 crate 預留給 Linux。"

[[bin]]
name = "awaylock"
path = "src/main.rs"

[dependencies]
awaylock-core = { workspace = true }
awaylock-runtime = { workspace = true }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
tray-icon = "0.19"
