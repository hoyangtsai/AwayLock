name: Release

# On every code change pushed to main: package the app, publish a GitHub Release,
# and update the Homebrew tap.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"

# Run one at a time to avoid races on version numbers and tap updates
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # Create the release and tag

jobs:
  release:
    runs-on: macos-latest # Apple Silicon (the cask is currently arm64-only)
    steps:
      - uses: actions/checkout@v4

      - name: Check tap token
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::Missing secret TAP_TOKEN (a PAT with write access to hoyangtsai/homebrew-app)"
            exit 1
          fi
          # Fail before building or releasing anything if the token cannot push to the tap
          PUSH="$(GH_TOKEN="$TAP_TOKEN" gh api repos/hoyangtsai/homebrew-app --jq '.permissions.push')"
          if [ "$PUSH" != "true" ]; then
            echo "::error::TAP_TOKEN cannot push to hoyangtsai/homebrew-app (needs Contents: Read and write on that repository)"
            exit 1
          fi

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Determine version
        id: ver
        run: |
          # Take major.minor from Info.plist; the patch number is the workflow run number
          BASE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' packaging/macos/Info.plist)"
          VERSION="${BASE%.*}.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Package
        env:
          AWAYLOCK_VERSION: ${{ steps.ver.outputs.version }}
          AWAYLOCK_BUILD: ${{ github.run_number }}
        run: scripts/package-macos.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Re-running a failed job must not fail because the release already exists
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "dist/awaylock-$VERSION-arm64.zip" --clobber
          else
            gh release create "v$VERSION" "dist/awaylock-$VERSION-arm64.zip" \
              --target "$GITHUB_SHA" \
              --title "awaylock $VERSION" \
              --generate-notes
          fi

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/hoyangtsai/homebrew-app.git" tap
          mkdir -p tap/Casks
          cp dist/awaylock.rb tap/Casks/awaylock.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/awaylock.rb
          git commit -m "awaylock $VERSION"
          git push origin HEAD:main
