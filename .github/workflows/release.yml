name: Release

# When a version tag (v1.2.3) is pushed: package the app, publish a GitHub Release
# for that tag, and update the Homebrew tap. The version comes from the tag name.
#
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

# Run one at a time to avoid races on tap updates
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # Create the release for the pushed tag

jobs:
  release:
    runs-on: macos-latest # Apple Silicon (the cask is currently arm64-only)
    steps:
      - uses: actions/checkout@v4

      - name: Check tap token
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::Missing secret TAP_TOKEN (a PAT with write access to hoyangtsai/homebrew-app)"
            exit 1
          fi
          # Fail before building or releasing anything if the token cannot push to the tap.
          # The repository API reports the user's own permission, not the token's, so use a
          # push dry-run: it authenticates against git-receive-pack, which requires write access.
          git clone --quiet --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/hoyangtsai/homebrew-app.git" "$RUNNER_TEMP/tap-check"
          if ! git -C "$RUNNER_TEMP/tap-check" push --dry-run origin HEAD:main; then
            echo "::error::TAP_TOKEN cannot push to hoyangtsai/homebrew-app (needs Contents: Read and write on that repository)"
            exit 1
          fi

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Determine version
        id: ver
        run: |
          # The version is the tag name without the leading "v" (v0.2.0 -> 0.2.0)
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not of the form vMAJOR.MINOR.PATCH (e.g. v0.2.0)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Package
        env:
          AWAYLOCK_VERSION: ${{ steps.ver.outputs.version }}
          AWAYLOCK_BUILD: ${{ github.run_number }}
        run: scripts/package-macos.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Re-running a failed job must not fail because the release already exists
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "dist/awaylock-$VERSION-arm64.zip" --clobber
          else
            gh release create "v$VERSION" "dist/awaylock-$VERSION-arm64.zip" \
              --verify-tag \
              --title "awaylock $VERSION" \
              --generate-notes
          fi

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/hoyangtsai/homebrew-app.git" tap
          mkdir -p tap/Casks
          cp dist/awaylock.rb tap/Casks/awaylock.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/awaylock.rb
          git commit -m "awaylock $VERSION"
          git push origin HEAD:main
